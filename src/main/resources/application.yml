server:
  # docs/02-api-contract.md / docs/12-mcp-implementation.md: bind loopback by default.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rag-mcp-service
  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${RAG_DB_USER:rag}
    password: ${RAG_DB_PASSWORD:rag_local_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    model:
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    mcp:
      server:
        enabled: true
        name: rag-mcp-service
        version: 0.1.0
        # docs/12-mcp-implementation.md: Streamable HTTP on POST/GET/DELETE /mcp.
        protocol: STREAMABLE
        type: SYNC
        stdio: false
        request-timeout: 30s
        # Critical: never auto-publish application @Tool beans as MCP tools.
        tool-callback-converter: false
        # Extra defense: do not scan @McpTool annotations either.
        annotation-scanner:
          enabled: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  admin:
    # Phase 4: WorkItem approve/deny require X-Admin-Token. Empty means "reject all" (fail closed).
    token: ${ADMIN_TOKEN:}
  mcp:
    # Phase 5: /mcp requires Authorization: Bearer <MCP_AUTH_TOKEN>. Empty means "reject all".
    # Deliberately separate from ADMIN_TOKEN. Never log the token; audit stores SHA-256[0..12].
    auth-token: ${MCP_AUTH_TOKEN:}
  upload:
    max-file-size-bytes: 20971520
    max-pdf-pages: 500
    allowed-extensions: pdf,docx,md,markdown,txt
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    dimension: 1024
    batch-size: 32
    retries: 2
    retry-backoff-ms: 500
    timeout-seconds: 120
    # Concurrent query/ingest embedding calls; docs/05 targets 10 concurrent retrievals.
    max-concurrent-calls: ${EMBEDDING_MAX_CONCURRENT_CALLS:10}
    # Phase 6b: query-only batching/cache. Ingestion still uses batch-size above.
    # query-batch-size=1 disables batching; query-cache-size=0 disables the cache.
    query-batch-size: ${QUERY_EMBEDDING_BATCH_SIZE:8}
    query-batch-window-ms: ${QUERY_EMBEDDING_BATCH_WINDOW_MS:5}
    query-cache-size: ${QUERY_EMBEDDING_CACHE_SIZE:1000}
    query-cache-ttl-seconds: ${QUERY_EMBEDDING_CACHE_TTL_SECONDS:300}
    query-queue-capacity: ${QUERY_EMBEDDING_QUEUE_CAPACITY:200}
    query-max-concurrent-batches: ${QUERY_EMBEDDING_MAX_CONCURRENT_BATCHES:3}
    query-wait-timeout-ms: ${QUERY_EMBEDDING_WAIT_TIMEOUT_MS:130000}
  pages:
    # Phase 10: deterministic chunk -> page aggregation (no LLM). A leaf section whose body
    # exceeds max-tokens is split at chunk boundaries into part=1..n; each part is embedded.
    max-tokens: ${PAGES_MAX_TOKENS:1200}
    max-content-chars: ${PAGES_MAX_CONTENT_CHARS:2000}
    # Best effort after upload: page failures are logged, never fail the upload. Rebuild endpoint
    # POST /api/v1/admin/pages/rebuild is the repair path.
    ingest-on-upload: ${PAGES_INGEST_ON_UPLOAD:true}
  wiki:
    # Phase 11: LLM-compiled wiki pages (kb_page.kind='wiki'). The key is only ever read from the
    # environment; an empty value makes POST /api/v1/admin/pages/compile-wiki fail closed with
    # ERR-LLM_NOT_CONFIGURED. Never put a real key in this file.
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    # The model reasons before answering; a generous output budget is required.
    max-tokens: ${WIKI_LLM_MAX_TOKENS:8192}
    temperature: 0.2
    timeout-seconds: ${WIKI_LLM_TIMEOUT_SECONDS:120}
    # Transport retries for 429/5xx/IO with exponential backoff (honours Retry-After).
    max-attempts: ${WIKI_LLM_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${WIKI_LLM_RETRY_BACKOFF_MS:1000}
    # One parse retry when a 200 response is not the required JSON object.
    parse-retries: 1
    concurrency: ${WIKI_COMPILE_CONCURRENCY:4}
  search:
    # Both routes return top 30 before RRF (docs/11-retrieval-and-eval-spec.md 3.3).
    candidate-limit: 30
    # Keyword branch uses at most the first 200 chars for ILIKE/similarity.
    keyword-max-chars: 200
    # Phase 8: split a question into at most N lexical terms, one ILIKE branch each.
    # A whole-question ILIKE matched 0 of the 40 eval questions; OR-ing terms fixed that.
    keyword-max-terms: ${KEYWORD_MAX_TERMS:8}
    # RRF weight of the keyword route (Phase 8). 1.0 = equal vote with the vector route, which
    # measurably regressed hit@1 (0.8286 -> 0.7429) because generic terms tie with a vector rank-1.
    keyword-weight: ${KEYWORD_WEIGHT:1.0}
    # Hybrid requires a chunk to contain this many distinct query terms before it enters RRF.
    # 1 generic term ("标准"/"要求") matches dozens of chunks and displaces correct vector hits.
    keyword-min-term-hits: ${KEYWORD_MIN_TERM_HITS:2}
    # pgvector >= 0.8: mitigate HNSW under-return when metadata filters are present.
    hnsw-iterative-scan: true
    # Phase 7 score-based abstention (docs/11-retrieval-and-eval-spec.md 3.4).
    # Defaults are calibrated on eval/qa.jsonl; see docs/acceptance/phase7-abstain.md.
    # enabled=false disables the score thresholds, but an empty result still gets a message.
    abstain:
      enabled: ${ABSTAIN_ENABLED:true}
      # Absolute floor for the top-1 cosine (bge-m3).
      min-top-score: ${ABSTAIN_MIN_TOP_SCORE:0.55}
      # Gray zone upper bound: at/above this the top-1 is treated as confident.
      high-confidence-top-score: ${ABSTAIN_HIGH_CONFIDENCE_TOP_SCORE:0.63}
      # TOO_NOISY requires this many candidates at/above min-top-score.
      min-dense-candidates: ${ABSTAIN_MIN_DENSE_CANDIDATES:8}
      # TOO_NOISY requires top-1 minus top-2 below this gap.
      min-score-gap: ${ABSTAIN_MIN_SCORE_GAP:0.02}
    # Phase 9 deterministic rerank (docs/acceptance/phase9-rerank.md).
    # RRF is a rank fusion and loses similarity magnitude; the rerank stage re-scores the fused head
    # with absolute signals. Score = rrf + sum(weight * normalized feature); see RerankProperties.
    rerank:
      # false restores the Phase 8 order exactly and leaves rerankScore out of the response.
      enabled: ${RERANK_ENABLED:true}
      # Candidates re-ordered, never smaller than topK (topK <= 20).
      top-n: ${RERANK_TOP_N:20}
      # Weight of the absolute cosine similarity (clamped to [0,1]).
      weight-vector-score: ${RERANK_WEIGHT_VECTOR_SCORE:0.25}
      # Weight of the fraction of query terms contained in the candidate content.
      weight-term-coverage: ${RERANK_WEIGHT_TERM_COVERAGE:0.01}
      # Weight of the normalized SectionTitleMatcher boost.
      weight-title-match: ${RERANK_WEIGHT_TITLE_MATCH:0.01}
      # Weight of "clauseId present"; fragments without clause structure are penalized.
      weight-clause: ${RERANK_WEIGHT_CLAUSE:0.02}
      # Weight of the short-chunk ramp min(1, chars / min-content-chars).
      weight-length: ${RERANK_WEIGHT_LENGTH:0.004}
      min-content-chars: ${RERANK_MIN_CONTENT_CHARS:80}

logging:
  level:
    root: INFO
    com.lqx.ragmcp: INFO
