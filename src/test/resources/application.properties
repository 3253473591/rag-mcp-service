# Phase 5: production /mcp is enabled by application.yml, but normal tests do not need the MCP
# transport. McpIntegrationTest / McpUnconfiguredTokenIntegrationTest override this with
# @TestPropertySource("spring.ai.mcp.server.enabled=true") and a test-only MCP token.
spring.ai.mcp.server.enabled=false

# Phase 8: the abstention guard stays ENABLED in integration tests; these values make it inert
# instead of switching it off. FakeEmbeddingService returns deterministic random unit vectors, so
# cosine similarity is ~0 rather than semantic, and the calibrated thresholds (0.55/0.63) would
# abstain on almost every query. Inert = a score that can never trip either branch:
#   NO_MATCH  needs top1 < min-top-score          (-2.0: impossible, cosine >= -1)
#   TOO_NOISY needs top1 < high-confidence (2.0) and gap < min-score-gap (0.0: impossible)
# AbstainGuardIntegrationTest / AbstainNoiseIntegrationTest override these to prove the wiring.
app.search.abstain.min-top-score=-2.0
app.search.abstain.high-confidence-top-score=2.0
app.search.abstain.min-dense-candidates=0
app.search.abstain.min-score-gap=0.0

# Phase 9: integration tests use FakeEmbeddingService (deterministic random unit vectors), so
# cosine is not semantic and the calibrated rerank weights would reorder results randomly. The
# Phase 8 pipeline stays the default for the existing integration tests; RerankIntegrationTest
# overrides enabled=true and proves the rerank contract with controlled embeddings.
app.search.rerank.enabled=false
